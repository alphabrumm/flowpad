<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpfad-Editor (PathFinder) · FlowPad</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../vendor/pathfinder/core/pathfinder.css">
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div class="app with-side" id="app">
  <!-- Attrappe von FlowPad: nur damit man Übernehmen und Ausprobieren erleben kann -->
  <section class="mock pf-side" aria-label="FlowPad (Attrappe)">
    <div class="mock-head"><span class="logo">F</span>FlowPad <span class="mock-tab" id="mTab">Tabelle 1</span><small>Attrappe für den Entwurf</small></div>
    <div class="mock-fx"><span class="addr" id="mAddr">D2</span><b>fx</b><input id="mFx" autocomplete="off" spellcheck="false" aria-label="Formel"></div>
    <div class="mock-grid"><table id="mGrid"></table></div>
    <div id="mTask"></div>
    <div class="mock-note">Zelle antippen, Formel oben eintragen, Return. Im Editor holt „aus FlowPad übernehmen“ die gewählte Zelle, ihre Formel oder die ganze Tabelle.</div>
  </section>

  <section class="lpwrap" aria-label="Lernpfad">
    <div class="ed-bar" id="edBar">
      <span class="ed-seg" id="modeSeg"><button data-mode="edit" aria-pressed="true">✎ Bearbeiten</button><button data-mode="preview">▶ Vorschau</button></span>
      <button class="ed-btn" id="bUndo" title="Rückgängig (⌘Z)" aria-label="Rückgängig">↶</button>
      <button class="ed-btn" id="bRedo" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen">↷</button>
      <button class="ed-btn" id="bSingle" title="Nur aktuelle Station zeigen" aria-pressed="false">◧<span class="t"> Station</span></button>
      <button class="ed-btn" id="bDesign" title="Design">🎨<span class="t"> Design</span></button>
      <button class="ed-btn" id="bWide" title="Lernpfad breit / neben FlowPad">⇔</button>
      <span class="sp"></span>
      <span class="ed-saved" id="saved"></span>
      <button class="ed-btn" id="bOpen" title="Lernpfad öffnen oder neu anlegen">📂<span class="t"> Öffnen</span></button>
      <button class="ed-btn" id="bMore" title="Mehr">⋯</button>
    </div>
    <div class="lp-scroll" id="scroll"><div class="lp" id="lp"></div></div>
  </section>
</div>
<script type="module">
import { startPathFinder } from '../vendor/pathfinder/core/pathfinder.js';
import { flowpadPlugin, createBridgeHost, makeBridge } from './flowpad-plugin.js';

// In FlowPad geöffnet (Menü → Lernpfad-Editor)? Dann spricht der Editor direkt mit FlowPad statt mit der Attrappe.
const inFlowPad = new URLSearchParams(location.search).get('in') === 'flowpad' && parent !== window;

const sheet = { A1: 'Artikel', B1: 'Preis', C1: 'Anzahl', D1: 'Gesamt', A2: 'Brezel', B2: '0,9', C2: '14', A3: 'Semmel', B3: '0,45', C3: '20', A4: 'Kakao', B4: '1,2', C4: '9' };
const sample = () => ({
  v: 2, id: 'entwurf', form: 'lernpfad', design: { pal: 0, font: 'pixel', shape: 'eckig', hero: 'logo', heroImg: '' },
  kicker: 'FlowPad · Lernpfad', title: 'Zellen und Formeln', subtitle: 'Jahrgangsstufe 9 · Tabellenkalkulation', goals: [], rank: '',
  stations: [
    { title: 'Willkommen', sub: 'Rundgang', blocks: [
      { type: 'text', html: 'In diesem Lernpfad rechnest du mit <b>Formeln</b> statt mit dem Taschenrechner. Links siehst du FlowPad, rechts diesen Lernpfad.' },
      { type: 'info', kind: 'merke', title: 'Merke', html: 'Eine Formel beginnt immer mit <code>=</code>.' } ] },
    { title: 'Rechnen mit Zellbezügen', sub: 'Baustein „Formel“', blocks: [
      { type: 'sheet', title: 'Pausenverkauf', html: 'Die Preisliste des Pausenverkaufs.', sheet: { cells: sheet }, rules: [], ok: '' },
      { type: 'fptask', id: 'auf21', title: 'Aufgabe 2.1', html: 'Schreibe in <b>D2</b> die Formel für den Gesamtpreis: Preis mal Anzahl.', xp: 30, app: { kind: 'formel', cell: 'D2', target: '=B2*C2', tabelle: '', dfd: '' }, tips: ['Tippe zuerst <code>=</code>, dann die Zelle B2 an.', 'Mal heißt in Formeln <code>*</code>.'], solution: '<code>=B2*C2</code>', img: '' },
      { type: 'lock', after: 'auf21' },
      { type: 'text', html: 'Stark! Jetzt kannst du die Formel nach unten ausfüllen – D3 und D4 rechnen dann automatisch mit.' } ] },
  ].map((s, i) => ({ id: 's' + i, check: false, ...s, blocks: s.blocks.map((b, j) => ({ id: b.id || `b${i}${j}`, ...b })) })),
  cert: { on: true, need: 'alle', pct: 80, text: 'hat den Lernpfad erfolgreich bearbeitet.', show: { zeit: true, tipps: true, quiz: true, xp: true } },
});

let host;
if (inFlowPad) {
  document.getElementById('app').classList.remove('with-side');
  document.querySelector('.mock')?.remove(); document.getElementById('bWide')?.remove();
  document.body.classList.add('in-flowpad');
  const bridge = makeBridge();
  host = createBridgeHost(bridge, { editor: true });
  addEventListener('message', e => { if (e.source === parent && e.data?.type === 'pf-open' && e.data.doc) { api.openDoc(e.data.doc); api.toast('Lernpfad aus dem Projekt geöffnet'); } });
  // Lehrkraft bearbeitet den Lernpfad des Projekts: „Fertig“ schreibt ihn ins Projekt zurück, ✕ verwirft
  const bar = document.getElementById('edBar');
  const done = document.createElement('button'); done.className = 'ed-btn pf-done'; done.title = 'Fertig: Lernpfad ins Projekt übernehmen'; done.innerHTML = '✓<span class="t"> Fertig</span>';
  done.onclick = async () => { done.disabled = true; try { bridge.post({ type: 'flowpad-set-lernpfad', html: await api.buildForApp(), title: api.current.title }); } catch (e) { done.disabled = false; api.toast('Übernehmen fehlgeschlagen: ' + e.message); } };
  const x = document.createElement('button'); x.className = 'ed-btn'; x.title = 'Schließen ohne Übernehmen'; x.setAttribute('aria-label', 'Schließen ohne Übernehmen'); x.textContent = '✕';
  x.onclick = () => { if (api.dirty && !confirm('Änderungen nicht ins Projekt übernehmen? (Dein Entwurf bleibt im Editor gespeichert.)')) return; bridge.post({ type: 'pf-editor-close' }); };
  bar.append(done, x);
  setTimeout(() => bridge.post({ type: 'pf-editor-ready' }), 50);
} else host = (await import('./mock.js')).createMock();
const api = startPathFinder({
  appName: 'FlowPad', logo: '../icon.svg', storage: 'lpeditor', plugins: [flowpadPlugin], host, sample,
  examples: 'beispiele/index.json', examplesTitle: 'Umgewandelte Lernpfade',
  // ältere Entwurfsfassung (vor PathFinder) übernehmen
  legacy: () => { try { const d = JSON.parse(localStorage.getItem('lpeditor.entwurf.v1')); if (d) d.id = 'entwurf'; return d; } catch (e) { return null; } },
});
host.attach(api);
</script>
</body></html>
