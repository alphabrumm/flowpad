# Baut FlowPad bei jeder Änderung auf main und veröffentlicht es auf GitHub Pages.
# Voraussetzung: Settings → Pages → Source = "GitHub Actions".
name: Pages veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node tools/test.mjs
      - name: App bauen
        run: node tools/build.mjs dist
      # Dasselbe Paket für einen eigenen Webspace (einfach den Inhalt hochladen)
      - uses: actions/upload-artifact@v4
        with: { name: flowpad-webspace, path: dist, include-hidden-files: true, retention-days: 30 }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
